server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3307/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:fincore-nexus-dev-secret-key-change-me-in-production-0123456789}   # MUST match the other services
  internal:
    api-key: ${INTERNAL_API_KEY:fincore-internal-dev-key-change-me-0123456789}              # MUST match account-service
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}