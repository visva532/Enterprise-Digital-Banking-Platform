server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3307/account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:fincore-nexus-dev-secret-key-change-me-in-production-0123456789}   # MUST match auth-service
  pii:
    secret: ${PII_SECRET:fincore-pii-dev-secret-change-me-in-production-9876543210}
  otp:
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  mail:
    from: no-reply@fincore.com